(--line);color:var(--quiet)}#kepler-page-studies .equation{font:400 28px/1.5 Georgia,serif;margin:18px 0;color:var(--ink)}#kepler-page-studies .composer-area{position:relative;max-width:680px;margin:0 auto}#kepler-page-studies .live-question{display:none;font-size:12px;color:var(--quiet);padding:0 10px 9px}#kepler-page-studies .question-trigger{text-align:left;padding:0}#kepler-page-studies .question-trigger::before{content:'?';display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:50%;width:17px;height:17px;margin-right:8px;font-size:10px}#kepler-page-studies .question-choices{position:absolute;z-index:5;left:0;top:28px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 25px light-dark(#0000000d,#00000035);border-radius:12px;padding:8px;display:flex;gap:4px}#kepler-page-studies .question-choices button{padding:7px 10px;border-radius:6px;font-size:12px}#kepler-page-studies .question-choices button:hover{background:var(--wash)}#kepler-page-studies .composer{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:16px 18px 12px;transition:padding 250ms;box-shadow:0 3px 12px light-dark(#272a2005,#00000012)}#kepler-page-studies .composer:focus-within{border-color:var(--sage)}#kepler-page-studies .composer textarea{width:100%;display:block;resize:none;background:transparent;border:0;padding:0;outline:none;min-height:27px;height:28px;transition:height 250ms;font-size:14px;line-height:1.7}#kepler-page-studies .writing .composer textarea{height:62px}#kepler-page-studies .composer-footer{display:flex;align-items:center;gap:12px;margin-top:8px}#kepler-page-studies .intent{font-size:11px;color:var(--quiet);flex:1}#kepler-page-studies .intent summary{cursor:inherit;list-style:none}#kepler-page-studies .intent input{width:100%;background:var(--wash);border:0;border-radius:5px;padding:5px}#kepler-page-studies .send{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--ink)!important;color:var(--surface)!important;flex-shrink:0}#kepler-page-studies .send svg{width:15px;height:15px}#kepler-page-studies .model{font-size:11px;color:var(--quiet)}#kepler-page-studies .ghost{display:none;color:var(--sage);font-size:12px;margin-top:5px}#kepler-page-studies .ghost button{font-size:10px;padding:1px 4px;border:1px solid var(--line);border-radius:4px;margin-left:8px}#kepler-page-studies .live-answer{display:none;color:var(--quiet);padding:10px 12px 0;font-size:12px;max-width:65ch}#kepler-page-studies .writing .live-question,#kepler-page-studies .writing .live-answer,#kepler-page-studies .writing .ghost{display:block}#kepler-page-studies .inline-help{position:absolute;z-index:9;max-width:340px;width:calc(100% - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 12px 32px light-dark(#00000012,#00000040)}#kepler-page-studies .inline-help input{border:0;border-bottom:1px solid var(--line);background:none;width:100%;padding:6px 0;font-size:12px;outline:none}#kepler-page-studies .inline-help p{font-size:12px;color:var(--quiet);margin-top:10px}#kepler-page-studies .inline-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--quiet)}#kepler-page-studies .inline-help button{padding:0 4px}#kepler-page-studies .field-head{text-align:center;max-width:490px;margin:0 auto}#kepler-page-studies .field-head .lead{margin:auto}#kepler-page-studies .field .orbit{height:245px;margin-top:12px}#kepler-page-studies .field .law-tabs{justify-content:center}#kepler-page-studies .lab-layout{display:grid;grid-template-columns:1fr 180px;gap:28px;align-items:center}#kepler-page-studies .lab .orbit{height:280px}#kepler-page-studies .lab .control{margin-top:20px}#kepler-page-studies .lab .controls{display:block;margin-top:0}#kepler-page-studies .lab h2{font:500 25px/1.3 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.7px}#kepler-page-studies .lab .lab-readout{font:400 30px/1.4 Georgia,serif;margin:22px 0 2px}#kepler-page-studies .story-layout{display:grid;grid-template-columns:70px 1fr;gap:20px}#kepler-page-studies .chapter-number{font:400 76px/.9 Georgia,serif;color:var(--line)}#kepler-page-studies .story .orbit{height:220px}#kepler-page-studies .story-footer{display:flex;justify-content:space-between;align-items:center;margin-top:15px;font-size:12px;color:var(--quiet)}#kepler-page-studies .next-law{border-bottom:1px solid var(--line)!important;padding:4px 0}#kepler-page-studies .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}#kepler-page-studies .compare-grid>div+div{border-left:1px solid var(--line);padding-left:22px}#kepler-page-studies .compare .orbit{height:185px}#kepler-page-studies .planet-name{display:flex;align-items:baseline;justify-content:space-between;font-size:13px}#kepler-page-studies .planet-name span{color:var(--quiet);font-size:11px}#kepler-page-studies .compare .lead{max-width:none}#kepler-page-studies .compare .equation{text-align:center;font-size:24px;margin:15px 0 0}
@media(max-width:620px){#kepler-page-studies .study{padding:16px 12px;min-height:1050px}#kepler-page-studies .sheet{padding:24px 20px}#kepler-page-studies .twocol,#kepler-page-studies .lab-layout{grid-template-columns:1fr;gap:15px}#kepler-page-studies h2{font-size:30px}#kepler-page-studies .orbit{height:200px}#kepler-page-studies .lab .orbit{height:220px}#kepler-page-studies .lab .controls{display:flex;gap:18px}#kepler-page-studies .story-layout{grid-template-columns:1fr;gap:12px}#kepler-page-studies .chapter-number{font-size:44px}#kepler-page-studies .compare-grid{grid-template-columns:1fr;gap:14px}#kepler-page-studies .compare-grid>div+div{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}#kepler-page-studies .compare .orbit{height:150px}#kepler-page-studies .preview-note{display:none}#kepler-page-studies .intent{max-width:65%}#kepler-page-studies .model{display:none}}

</style>
<script>
(()=>{
const root=document.getElementById('kepler-page-studies');
const laws=[{name:'The shape of an orbit',title:'An ellipse. Not quite a circle.',body:'A planet follows an ellipse, with the Sun at one focus. Change the eccentricity to see a circle become more elongated.',short:'Elliptical paths'},{name:'The rhythm of an orbit',title:'Equal time. Equal area.',body:'A planet moves faster near the Sun and slower farther away. The line to the Sun sweeps out equal areas in equal times.',short:'Equal areas'},{name:'The size of an orbit',title:'Farther away. A longer year.',body:'For planets orbiting the same star, orbital period squared is proportional to semimajor axis cubed. A larger orbit takes longer to complete.',short:'Orbital periods'}];
const captions=['Shape is controlled by eccentricity.','The shaded regions represent equal time intervals.','Period is measured in Earth years for a Sun-mass star.'];
const orbit=(extra='')=>`<svg class="orbit ${extra}" viewBox="0 0 500 350" role="img" aria-label="Elliptical orbit with the Sun at a focus and a planet at the selected time"><path class="sector near"/><path class="sector far"/><ellipse class="track"/><line class="radius"/><circle class="sun" r="8"/><circle class="planet" r="5"/></svg>`;
const tabs=()=>`<div class="law-tabs" aria-label="Kepler law">${laws.map((l,i)=>`<button type="button" class="cursor-interaction" data-law="${i}" aria-pressed="${i===1}">${l.short}</button>`).join('')}</div>`;
const controls=()=>`<div class="controls"><label class="control"><span class="control-label">Eccentricity <output class="e-label">0.45</output></span><input class="e-range" type="range" min="0" max="65" value="45" aria-label="Orbit eccentricity"></label><label class="control"><span class="control-label">Time through orbit <output class="phase-label">15%</output></span><input class="phase-range" type="range" min="0" max="100" value="15" aria-label="Time through orbit"></label></div>`;
const intro=(eyebrow,title,body)=>`<p class="eyebrow">${eyebrow}</p><h2 contenteditable="true" role="textbox" aria-label="Editable page title" spellcheck="false">${title}</h2><p class="lead" contenteditable="true" role="textbox" aria-label="Editable explanation">${body}</p>`;
const diagrams=()=>`${orbit()}<div class="orbit-caption"><span>Sun at one focus</span><span class="speed-label">Relative speed 1.00×</span></div>`;
const bodies=[
`<div class="twocol"><div>${intro('KEPLER · THE SECOND LAW','A changing speed.<br>A constant rhythm.',laws[1].body)}<div class="equation" contenteditable="true" aria-label="Editable equation">dA / dt = constant</div></div><div>${diagrams()}${controls()}</div></div>${tabs()}`,
`<div class="field-head">${intro('A FIELD GUIDE TO PLANETARY MOTION','Three laws. One beautiful orbit.','See how the shape, speed and size of an orbit fit together.')}</div>${diagrams()}${tabs()}<div class="detail-line" contenteditable="true" aria-label="Editable caption">${laws[1].body}</div>${controls()}`,
`${intro('ORBIT LAB','Make the orbit your own.','Change one variable. Watch the relationship respond.')}<div class="lab-layout"><div>${diagrams()}</div><div><p class="eyebrow">Selected relationship</p><h3>Equal areas</h3><div class="lab-readout">dA / dt</div><p class="lead">Constant throughout the orbit.</p>${controls()}</div></div>${tabs()}`,
`<div class="story-layout"><div class="chapter-number">02</div><div>${intro('KEPLER · A VISUAL EXPLANATION',laws[1].title,laws[1].body)}${diagrams()}${controls()}<div class="story-footer"><span class="chapter-progress">Second of three laws</span><button type="button" class="next-law cursor-interaction">Next: orbital periods →</button></div></div></div>`,
`${intro('THE THIRD LAW','Why Mars has a longer year.','Keep the star the same. Compare the size of two orbits and the time each takes.')}<div class="compare-grid"><div><div class="planet-name">Earth <span>1 AU · 1 year</span></div>${orbit('earth-orbit')}</div><div><div class="planet-name">Comparison orbit <span class="period-value">1.52 AU · 1.87 years</span></div>${orbit()}<label class="control"><span class="control-label">Semimajor axis <output class="a-label">1.52 AU</output></span><input class="a-range" type="range" min="70" max="220" value="152" aria-label="Comparison semimajor axis"></label></div></div><div class="equation" contenteditable="true" aria-label="Editable equation">T² ∝ a³</div><p class="detail-line" contenteditable="true" aria-label="Editable caption">A planet with an orbit 1.52 times as large takes about 1.87 Earth years to go around the Sun.</p>`];
const classes=['atlas','field','lab','story','compare'];
root.querySelectorAll(':scope > section').forEach((section,index)=>{
section.innerHTML=`<div class="study ${classes[index]}" aria-label="${section.dataset.variant} page preview"><div class="topbar"><div class="brand">ai interaction <span class="preview-note"> / design preview</span></div><div class="versionbar"><button type="button" class="back cursor-interaction" aria-label="Previous page" disabled><i data-lucide="arrow-left" aria-hidden="true"></i></button><button type="button" class="forward cursor-interaction" aria-label="Next page" disabled><i data-lucide="arrow-right" aria-hidden="true"></i></button><span class="version-label">Page 1 / 1</span></div></div><div class="page-slot"><article class="sheet">${bodies[index]}<div class="inline-help" hidden><div class="inline-head">About this passage <button type="button" class="close-inline cursor-interaction" aria-label="Close passage question">×</button></div><input placeholder="Ask about this…" aria-label="Question about selected text"><p hidden></p></div></article></div><div class="composer-area"><div class="live-question"><button type="button" class="question-trigger cursor-interaction">Would a visual example or a derivation help?</button><div class="question-choices" hidden><button type="button" class="cursor-interaction">Visual example</button><button type="button" class="cursor-interaction">Derivation</button></div></div><div class="composer"><textarea aria-label="Next instruction" placeholder="What would you like to explore next?" rows="1">Explain why the planet speeds up near the Sun.</textarea><div class="ghost">Use a visual example.<button type="button" class="accept-ghost cursor-interaction" aria-label="Accept suggested sentence">Tab ↹</button></div><div class="composer-footer"><details class="intent"><summary>Explore planetary motion ⌄</summary><input aria-label="Edit intent" value="Understand why orbital speed changes"></details><span class="model">Auto</span><button type="button" class="send cursor-interaction" aria-label="Create example next page"><i data-lucide="arrow-up" aria-hidden="true"></i></button></div></div><p class="live-answer">Near the Sun, a planet moves faster while sweeping out the same area per unit of time.</p></div></div>`;
const s=section.querySelector('.study'),sheet=s.querySelector('.sheet'),slot=s.querySelector('.page-slot'),area=s.querySelector('.composer-area'),field=s.querySelector('textarea');
let law=index===4?2:1,e=index===4?.0934:.45,phase=.15,a=1.52,versions=[],at=0,hoverTimer;
const shape={scale:90,radius:16};
function size(){const ratio=s.classList.contains('writing')?shape.scale/100:1;slot.style.height=sheet.offsetHeight*ratio+'px';}
function writing(on){clearTimeout(hoverTimer);s.classList.toggle('writing',on);size();if(!on)s.querySelector('.question-choices').hidden=true;}
area.addEventListener('focusin',()=>writing(true));sheet.addEventListener('focusin',()=>writing(false));sheet.addEventListener('pointerenter',event=>{if(event.pointerType==='mouse')hoverTimer=setTimeout(()=>writing(false),140);});sheet.addEventListener('pointerleave',()=>clearTimeout(hoverTimer));sheet.addEventListener('pointerdown',()=>writing(false));
const solve=M=>{let E=M;for(let j=0;j<10;j++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));return E;};
function draw(svg,ee=e,pp=phase){const cx=250,cy=175,rx=index===4?190*(svg.classList.contains('earth-orbit')?1:a)/2.2:190,ry=rx*Math.sqrt(1-ee*ee),sun=cx+rx*ee;let E=pp*Math.PI*2;for(let j=0;j<10;j++)E-=(E-ee*Math.sin(E)-pp*Math.PI*2)/(1-ee*Math.cos(E));const xy=t=>[cx+rx*Math.cos(t),cy+ry*Math.sin(t)];const p=xy(E);const ellipse=svg.querySelector('ellipse');for(const [k,v] of Object.entries({cx,cy,rx,ry}))ellipse.setAttribute(k,v);svg.querySelector('.sun').setAttribute('cx',sun);svg.querySelector('.sun').setAttribute('cy',cy);svg.querySelector('.planet').setAttribute('cx',p[0]);svg.querySelector('.planet').setAttribute('cy',p[1]);for(const[k,v]of Object.entries({x1:sun,y1:cy,x2:p[0],y2:p[1]}))svg.querySelector('line').setAttribute(k,v);
 const solveHere=M=>{let E=M;for(let j=0;j<10;j++)E-=(E-ee*Math.sin(E)-M)/(1-ee*Math.cos(E));return E;};for(const[name,m]of [['near',0],['far',Math.PI]]){const x=xy(solveHere(m)),y=xy(solveHere(m+.6));svg.querySelector('.'+name).setAttribute('d',`M ${sun} ${cy} L ${x[0]} ${x[1]} A ${rx} ${ry} 0 0 1 ${y[0]} ${y[1]} Z`);svg.querySelector('.'+name).style.display=law===1?'':'none';}
}
function render(){s.querySelectorAll('.orbit').forEach(svg=>draw(svg,svg.classList.contains('earth-orbit')?.0167:e,phase));const speed=Math.sqrt(2/(1-e*Math.cos(solve(phase*Math.PI*2)))-1);s.querySelectorAll('.speed-label').forEach(n=>n.textContent='Relative speed '+speed.toFixed(2)+'×');s.querySelectorAll('.e-label').forEach(n=>n.textContent=e.toFixed(2));s.querySelectorAll('.phase-label').forEach(n=>n.textContent=Math.round(phase*100)+'%');s.querySelectorAll('[data-law]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.law===law)));s.querySelector('.period-value')?.replaceChildren(document.createTextNode(a.toFixed(2)+' AU · '+Math.pow(a,1.5).toFixed(2)+' years'));s.querySelector('.a-label')?.replaceChildren(document.createTextNode(a.toFixed(2)+' AU'));size();}
function bindPage(){sheet.querySelectorAll('[data-law]').forEach(b=>b.onclick=()=>{law=+b.dataset.law;const title=sheet.querySelector('h2');if(index===0||index===3)title.textContent=laws[law].title;const caption=sheet.querySelector('.detail-line')||sheet.querySelector('.lead');caption.textContent=laws[law].body;if(index===2){sheet.querySelector('h3').textContent=laws[law].short;sheet.querySelector('.lab-readout').textContent=['0 ≤ e < 1','dA / dt','T² ∝ a³'][law];}if(index===0)sheet.querySelector('.equation').textContent=['0 ≤ e < 1','dA / dt = constant','T² ∝ a³'][law];render();});sheet.querySelectorAll('.e-range').forEach(el=>el.oninput=()=>{e=+el.value/100;render();});sheet.querySelectorAll('.phase-range').forEach(el=>el.oninput=()=>{phase=+el.value/100;render();});const ar=sheet.querySelector('.a-range');if(ar)ar.oninput=()=>{a=+ar.value/100;phase=(a-.7)/1.5;e=.0934;sheet.querySelector('.detail-line').textContent=`An orbit ${a.toFixed(2)} times as large takes about ${Math.pow(a,1.5).toFixed(2)} Earth years to complete.`;render();};const next=sheet.querySelector('.next-law');if(next)next.onclick=()=>{law=(law+1)%3;sheet.querySelector('h2').textContent=laws[law].title;sheet.querySelector('.lead').textContent=laws[law].body;sheet.querySelector('.chapter-number').textContent='0'+(law+1);sheet.querySelector('.chapter-progress').textContent=['First','Second','Third'][law]+' of three laws';next.textContent='Next: '+laws[(law+1)%3].short.toLowerCase()+' →';render();};sheet.querySelector('.close-inline').onclick=()=>sheet.querySelector('.inline-help').hidden=true;sheet.querySelector('.inline-help input').oninput=event=>{const p=sheet.querySelector('.inline-help p');p.hidden=!event.target.value;p.textContent='Gravity acts toward the Sun, so it exerts no torque about the Sun. The resulting angular momentum conservation gives a constant areal velocity.';size();};}
function snapshot(){return {html:sheet.innerHTML,e,phase,a,law};}function history(){s.querySelector('.back').disabled=at===0;s.querySelector('.forward').disabled=at===versions.length-1;s.querySelector('.version-label').textContent='Page '+(at+1)+' / '+versions.length;}
function navigate(delta){versions[at]=snapshot();at+=delta;const v=versions[at];sheet.innerHTML=v.html;e=v.e;phase=v.phase;a=v.a;law=v.law;sheet.querySelector('.inline-help').hidden=true;bindPage();render();history();writing(false);}
s.querySelector('.back').onclick=()=>navigate(-1);s.querySelector('.forward').onclick=()=>navigate(1);
