<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An idea is enough. Shape your intent, explore possibilities, and work on a document with AI Interaction.">
  <meta name="theme-color" content="#f8f8f8">
  <title>AI Interaction</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body class="intent-first">
  <main>
    <h1 class="sr-only">AI Interaction</h1>
    <div class="workspace">
      <section class="intent-panel" aria-label="Your developing intent">
        <section id="limit-card" class="limit-card" role="status" aria-labelledby="limit-message" hidden>
          <div id="limit-media" class="limit-media"><video id="limit-video" src="/demo.mp4" muted loop playsinline preload="none" aria-label="A short demo of AI Interaction"></video></div>
          <p id="limit-message">Today’s limit has been reached. Try again tomorrow.</p>
        </section>
        <label for="intent-input" class="section-label">What’s on your mind?</label>
        <div class="composer"><div class="input-mirror-layer" aria-hidden="true"><div id="input-mirror"></div></div><textarea id="intent-input" aria-label="Your next instruction" rows="1" maxlength="4000" placeholder="What would you like to explore?"></textarea><div class="composer-bottom"><button id="clarify-phrase" class="refine-trigger" type="button" hidden aria-label="Review intent" title="Review intent" aria-haspopup="dialog" aria-controls="intent-details" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg></button><span id="input-state" class="sr-only"></span><div class="composer-actions"><button id="composer-scope" class="composer-context" aria-label="Focus the next instruction" title="Choose what should change" aria-haspopup="dialog" aria-controls="intent-popover" aria-expanded="false" hidden><span id="focus-label">Focus</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button><button id="build-page" class="explore-button" disabled aria-label="Explore interactively" title="Create an interactive page (⌘ Enter)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></div></div>

        <div id="intent-refinements" class="intent-refinements" aria-label="Editable details" hidden></div><div id="typing-assistance" hidden>
          <section id="quick-preview" aria-label="Quick answer" hidden><p id="quick-answer"></p><span id="quick-provenance" hidden></span></section>
        </div>
        <p id="status" class="status-line" role="status" hidden>Demo responses use built-in examples. No draft text is sent.</p>
        <button id="cancel-button" class="quiet-button" hidden>Pause preview</button>
        <button id="start-demo" class="start-demo" type="button" aria-haspopup="dialog"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1.2v7.6L8.6 5z" fill="currentColor"/></svg>How it works</button>
      </section>
      <section class="document-panel" aria-label="Interactive page">
        <div class="document-toolbar"><span class="document-location">Your interactive page</span><div class="document-actions"><button id="page-back" class="page-nav" aria-label="Previous page" disabled>←</button><button id="page-forward" class="page-nav" aria-label="Next page" disabled>→</button><span id="page-position" aria-live="polite"></span><button id="undo-edit" class="quiet-button" aria-label="Undo direct edit" disabled>Undo</button><button id="history-button" class="quiet-button" aria-expanded="false" aria-controls="history-panel">History <span id="history-count">0</span></button><button id="download-button" class="quiet-button">Export</button><button id="how-it-works" class="quiet-button" aria-haspopup="dialog">How it works</button></div></div>
        <div id="history-panel" class="history-panel" role="region" aria-label="Document versions" hidden><div class="section-heading"><h3>Document versions</h3><button id="close-history" class="quiet-button">Close</button></div><div id="history-list"></div></div>
        <div class="paper"><p id="submitted-request" class="submitted-request"></p><div id="page-progress" class="page-progress" role="status" hidden></div>
          <label class="sr-only" for="document-title">Document title</label><textarea id="document-title" data-edit-key="title" class="document-title" rows="1" maxlength="160"></textarea>
          <span id="page-update" class="sr-only" role="status"></span><div id="active-component"></div>
          <details class="page-notes"><summary>Your notes</summary><div class="page-field"><label class="sr-only" for="document-input">Write in your document</label><textarea id="document-input" data-page-field="notes" data-edit-key="notes" rows="2" maxlength="20000" placeholder="Ask a question, or highlight any passage to explore it."></textarea></div></details>
          <section id="proposal" class="proposal" hidden aria-label="New version of the page"><div class="proposal-heading"><span class="suggestion-marker" aria-hidden="true"></span><span id="proposal-label">A new version is ready</span></div><p id="proposal-reason" class="proposal-reason"></p><h3 id="proposal-title"></h3><div id="proposal-content"></div><div class="proposal-actions"><span id="proposal-provenance" class="proposal-note"></span><button id="dismiss-button" class="proposal-secondary">Keep current page</button><button id="accept-button" class="primary-button">Replace page</button></div></section>
        </div>
      </section>
    </div>
  </main>
  <section id="intent-popover" role="dialog" aria-labelledby="popover-question" hidden><div class="popover-heading"><h2 id="popover-question"></h2><button id="close-popover" class="popover-close" aria-label="Close clarification"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="popover-options" class="popover-options"></div><button id="custom-answer-button" class="custom-answer-button" aria-expanded="false" aria-controls="popover-custom-form">Something else…</button><form id="popover-custom-form" hidden><label class="sr-only" for="popover-custom">Your answer</label><input id="popover-custom" maxlength="120" placeholder="In your own words…"><button type="submit" class="custom-apply" aria-label="Use custom answer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></form></section>
  <dialog id="demo-dialog" class="demo-dialog" aria-label="How AI Interaction works"><button id="close-demo" class="demo-close" aria-label="Close">×</button><video id="demo-video" src="/demo.mp4" controls playsinline preload="none"></video></dialog>
</body>
</html>
