<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Component gallery — AI Interaction</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body{background:#f8f9f6;margin:0}
    .gallery{max-width:1180px;margin:0 auto;padding:40px 24px 80px}
    .gallery h1{font:600 24px/1.3 'DM Sans',sans-serif;margin:0 0 6px}
    .gallery>p{color:#68736b;margin:0 0 32px;max-width:640px}
    .specimen{background:#fff;border:1px solid #e5e6df;border-radius:20px;padding:28px;margin-bottom:24px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px}
    .specimen-meta h2{font:600 15px/1.4 'DM Sans',sans-serif;margin:0 0 4px}
    .specimen-meta code{font-size:12px;color:#4f6b45;background:#eef2e8;padding:2px 6px;border-radius:6px}
    .specimen-meta p{font-size:13px;line-height:1.55;color:#68736b;margin:10px 0 0}
    .specimen .component-block{border-top:0;margin-top:0;padding-top:0}
    @media(max-width:760px){.specimen{grid-template-columns:1fr;gap:16px;padding:20px 16px}}
  </style>
</head>
<body>
  <main class="gallery">
    <h1>Component gallery</h1>
    <p>Each prebuilt component rendered from sample model output. One item is in focus; select another, or focus a diagram and use the arrow keys.</p>
    <div id="specimens"></div>
  </main>
  <script type="module" src="/__dev/components.js"></script>
</body>
</html>
