<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Composer controls — AI Interaction</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body{background:#f6f6f6;margin:0}
    .gallery{max-width:1240px;margin:0 auto;padding:40px 24px 80px}
    .gallery h1{font:600 24px/1.3 'DM Sans',sans-serif;margin:0 0 6px}
    .gallery>p{color:#707070;margin:0 0 28px;max-width:680px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px 24px;align-items:start}
    .specimen-meta{display:flex;align-items:baseline;gap:8px;margin:0 0 10px 4px}
    .specimen-meta h2{font:600 14px/1.4 'DM Sans',sans-serif;margin:0}
    .specimen-meta code{font-size:11px;color:#1d1d1f;background:#f0f0f0;padding:2px 6px;border-radius:6px}
    /* A static replica of #intent-popover so controls render exactly as in the app. */
    .control-sample{width:304px;padding:8px;background:#fff;border-radius:14px;box-shadow:0 10px 38px #1d1d1d20,0 2px 7px #1d1d1d0a}
    .control-sample h3{font-size:.8125rem;line-height:1.5;font-weight:550;color:#3e3e3e;margin:3px 0 0;padding:9px 8px 10px 10px}
  </style>
</head>
<body>
  <main class="gallery">
    <h1>Composer controls</h1>
    <p>Every information type the composer can ask about, rendered with sample suggestions inside the real popover. Choosing applies immediately: single choices close, multi-choices update live, and typed answers apply on Enter.</p>
    <div class="grid" id="grid"></div>
  </main>
  <script type="module" src="/__dev/controls.js"></script>
</body>
</html>
